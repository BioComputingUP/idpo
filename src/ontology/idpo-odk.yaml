id: idpo
title: "Intrinsically Disordered Proteins Ontology"
github_org: BioComputingUP
git_main_branch: main
repo: idpo
release_artefacts:
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  use_base_merging: TRUE
  slme_individuals: exclude
  exclude_iri_patterns:
    - <http://purl.obolibrary.org/obo/CHEBI_*>
    - <http://purl.obolibrary.org/obo/SO_*>
    - <http://purl.obolibrary.org/obo/UBERON_*>
    - <http://purl.obolibrary.org/obo/CL_*>
    - <http://purl.obolibrary.org/obo/NCBITaxon_*>
  products:
    - id: ro
      use_base: TRUE
    - id: omo
    - id: bfo
    - id: go
      use_base: TRUE
    - id: iao
    - id: pr
      use_gzipped: TRUE
      is_large: TRUE
      make_base: TRUE
    - id: cob
      use_base: TRUE
documentation:
  documentation_system: mkdocs
robot_java_args: "-Xmx8G"
robot_report:
  use_base_iris: TRUE
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
